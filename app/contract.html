<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Zunyi Wang">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Graphic Designer Zunyi Wang">
    <title>王尊一 WANG ZUNYI | DESIGNER</title>
    
  </head>

  <body class="bodystyle">

    <header>
      <div id="backgroundDivAbout"></div>
      <div class="line1"></div>
    </header>

    <main>
      <content>
        <!-- Contract Input Section -->
        <div class="contract-form">
          <h2>合同生成</h2>
          <div class="form-group">
            <label for="clientName">项目：</label>
            <input class = "bodyText" type="text" id="projectName" placeholder="项目名">
          </div>
          <div class="form-group">
            <label for="clientName">甲方：</label>
            <input type="text" id="clientName" placeholder="名称">
          </div>
          
          <div class="form-group">
            <label for="price">金额：</label>
            <input type="number" id="price" placeholder="金额">
            <label for="price">元</label>
          </div>
          <div class="form-group">
            <label for="clientName">支付方式：</label>
            <input type="text" id="payment" placeholder="支付平台">
          </div>


          <button id="generateBtn">Generate PDF</button>
          <div id="pdfLink">
            <p>PDF generated: <a id="downloadLink" href="#" download="contract.pdf">Download here</a></p>
          </div>
        </div>

        <!-- Your existing aboutDiv -->
        <div id="aboutDiv">
          <div id="aboutText"></div>
        </div>
      </content>
    </main>

    <footer>
      <content></content>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module" src="contract.js"></script>
    <!-- <script type="module" src="../homepage.js"></script> -->
    <!-- <script type="module" src="../index.js"></script> -->
    <link rel="stylesheet" href="style.css">
  </body>
</html>
