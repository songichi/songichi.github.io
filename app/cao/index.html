<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>草书练习</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">草书练习</h1>
    <div class="mode-switch" role="group" aria-label="学习模式">
      <button class="mode-switch-btn is-active" id="mode-default" data-mode="default">默认</button>
      <button class="mode-switch-btn" id="mode-time" data-mode="time">时间</button>
    </div>
    <button class="btn-icon" id="btn-settings" aria-label="字库设置" title="字库设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </header>

  <main class="page">
    <div class="container">
      <section class="practice-area">
        <div class="character-display" id="character-display">—</div>
        <div class="cursive-preview hidden" id="cursive-preview">
          <img id="cursive-image" src="" alt="草书">
          <p class="cursive-placeholder" id="cursive-placeholder">草书图片尚未添加</p>
        </div>
        <button class="btn-icon btn-eye" id="btn-show" aria-label="显示草书" title="显示草书">
          <svg class="icon-eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-closed" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </section>

      <footer class="footer">
        <button class="btn btn-primary" id="btn-refresh">刷新</button>
      </footer>
    </div>
  </main>

  <aside class="stats-panel">
      <table class="stats-table">
        <tbody id="stats-body">
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
          <tr class="stats-row is-empty"><td class="stats-char"></td><td class="stats-count"></td></tr>
        </tbody>
      </table>
    </aside>

  <!-- 字库设置面板 -->
  <dialog class="dialog" id="settings-dialog">
    <div class="dialog-content">
      <h2 class="dialog-title">字库设置</h2>
      <p class="dialog-hint">输入要练习的汉字，可用空格分隔，也可连续输入。</p>
      <textarea
        class="dialog-textarea"
        id="characters-input"
        placeholder="例如：永和九年 或 永和九年岁在癸丑"
        rows="6"
      ></textarea>
      <div class="dialog-stats">
        当前字库：<span id="char-count">0</span> 字
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" id="btn-cancel">取消</button>
        <button class="btn btn-primary" id="btn-save">保存</button>
      </div>
    </div>
  </dialog>

  <script src="js/database.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
